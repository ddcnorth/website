name: Check website

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        run: sh scripts/build.sh
      - name: Only website files are published
        run: |
          test -f _site/index.html && test -f _site/fr/index.html && test -f _site/404.html
          ! test -e _site/_routes.json
          ! test -e _site/functions
