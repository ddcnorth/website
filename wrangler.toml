# Cloudflare Pages project configuration for ddcnorth.com (static marketing site).
# This file is the source of truth for the Pages project's bindings: it deliberately has none.
# The client portal on /api, /p, /admin, /access and /portal is a separate Worker,
# ddcnorth-portal, in the ddcnorth/portal repo.
name = "ddcnorth-website"
pages_build_output_dir = "_site"
compatibility_date = "2026-10-01"
